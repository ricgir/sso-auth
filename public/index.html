<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
</head>
<body>

<h2>Register</h2>
<input id="ruser" placeholder="Username"><br><br>
<input id="rpass" type="password" placeholder="Password"><br><br>
<button onclick="register()">Register</button>

<hr>

<h2>Login</h2>
<input id="luser" placeholder="Username"><br><br>
<input id="lpass" type="password" placeholder="Password"><br><br>
<button onclick="login()">Login</button>

<script>
const BASE = "http://YOUR_IP:5000";

// Register
async function register() {
  const username = document.getElementById("ruser").value;
  const password = document.getElementById("rpass").value;

  const res = await fetch(BASE + "/register", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ username, password })
  });

  const data = await res.json();
  alert(data.message || data.error);
}

// Login
async function login() {
  const username = document.getElementById("luser").value;
  const password = document.getElementById("lpass").value;

  const res = await fetch(BASE + "/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ username, password })
  });

  const data = await res.json();

  if (data.token) {
    localStorage.setItem("token", data.token);
    alert("Login successful");
  } else {
    alert(data.error);
  }
}
</script>

</body>
</html>
